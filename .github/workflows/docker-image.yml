name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: rafaelfernn/imd_editais
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}},enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: SMTP_USER,SMTP_PASS,ALERT_EMAIL
          script: |
            set -e
            cd /home/ubuntu/ImdEditaisAutomation
            # Replaces KEY in .env with the given value, adding it if missing.
            set_env() {
              grep -v "^$1=" .env > .env.tmp 2>/dev/null || true
              printf "%s='%s'\n" "$1" "$2" >> .env.tmp
              mv .env.tmp .env
            }
            # Pin the deploy to this commit's immutable tag (compose reads IMAGE_TAG from .env)
            set_env IMAGE_TAG "sha-${{ github.sha }}"
            # WhatsApp disconnect alerts by email (Gmail SMTP). Skipped while the
            # secrets are unset, so the server's .env is never blanked.
            if [ -n "$SMTP_PASS" ]; then
              set_env SMTP_HOST smtp.gmail.com
              set_env SMTP_PORT 465
              set_env SMTP_USER "$SMTP_USER"
              set_env SMTP_PASS "$SMTP_PASS"
              set_env MAIL_FROM "Bot Vagas <$SMTP_USER>"
              set_env ALERT_EMAIL "$ALERT_EMAIL"
            else
              echo "SMTP secrets not set, skipping email alert config"
            fi
            docker compose pull app
            docker compose up -d app
            docker compose exec -T app sh -c 'test -n "$SMTP_HOST"' \
              && echo "SMTP config loaded in app" \
              || echo "WARNING: SMTP_HOST missing in app container (env_file .env not in compose?)"
