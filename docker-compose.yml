# Full self-contained stack: app + Postgres + Redis + MinIO + Loki + Grafana.
# Every published host port can be overridden in .env (POSTGRES_PORT, REDIS_PORT,
# MINIO_PORT, MINIO_CONSOLE_PORT, LOKI_PORT, GRAFANA_PORT, PORT) if you already
# run any of these services on the host.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-projeto_ai}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-projeto_ai}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for the currículos/editais PDFs.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_REGION: ${MINIO_REGION:-us-west-1}
    ports:
      - '${MINIO_PORT:-9000}:9000'          # S3 API
      - '${MINIO_CONSOLE_PORT:-9001}:9001'  # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the `editaisimd` bucket the app uploads to.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/editaisimd &&
      echo 'bucket editaisimd ready'
      "
    restart: 'no'

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ['-config.file=/etc/loki/local-config.yaml']
    ports:
      - '${LOKI_PORT:-3100}:3100'
    volumes:
      - loki_data:/loki
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:3100/ready | grep -q ready']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Optional log UI; Loki is pre-wired as a datasource.
  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    ports:
      - '${GRAFANA_PORT:-3000}:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Picks up OPENAI_API_KEY / LLM_MODEL / LLM_BASE_URL and anything else
    # you keep locally; the values below override the host-specific ones.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 7638
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:7638}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-projeto_ai}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_URL: http://minio:9000
      MINIO_REGION: ${MINIO_REGION:-us-west-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      LOKI_URL: http://loki:3100
    ports:
      - '${PORT:-7638}:7638'
    volumes:
      # WhatsApp session, so you only scan the QR code once.
      - wwebjs_auth:/app/.wwebjs_auth
      - wwebjs_cache:/app/.wwebjs_cache
    # Chromium needs more than the default 64MB of /dev/shm.
    shm_size: '1gb'
    # `docker compose up -d` then `docker compose logs -f app` to read the QR code.
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
  loki_data:
  grafana_data:
  wwebjs_auth:
  wwebjs_cache:
